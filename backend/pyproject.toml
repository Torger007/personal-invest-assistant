[project]
name = "personal-invest-assistant"
version = "0.1.0"
description = "轻量化个人投资分析助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # 数据库
    "sqlalchemy>=2.0.0",

    # 数据验证
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # HTTP客户端
    "httpx>=0.27.0",

    # HTML解析
    "beautifulsoup4>=4.12.0",

    # 数据处理
    "pandas>=2.2.0",
    "numpy>=2.0.0",

    # 技术指标
    "ta>=0.11.0",

    # 定时任务
    "apscheduler>=3.10.0",

    # 环境变量
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
