[project]
name = "personal-invest-assistant"
version = "0.1.0"
description = "轻量化个人投资分析助手"
requires-python = ">=3.11"
dependencies = [
    # Web框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 数据库 (PostgreSQL 异步)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    # 数据库迁移
    "alembic>=1.14.0",
    # 数据验证
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # 数据处理
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    # 金融数据（akshare）
    "akshare>=1.14.0",
    # 技术指标
    "ta>=0.11.0",
    # 定时任务
    "apscheduler>=3.10.0",
    # 环境变量
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # LLM Provider
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "curl-cffi>=0.15.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
